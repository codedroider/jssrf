<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>jssrf</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Arial Black', sans-serif; user-select: none; touch-action: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; background: rgba(0,0,0,0.5); }
        #menu-screen { background: linear-gradient(to bottom, #3a9ad9, #1e4f6e); }
        #game-ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; z-index: 10; line-height: 1.4; pointer-events: none; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #active-powerup { color: #ffeb3b; font-size: 18px; margin-top: 5px; display: none; }
        #pause-btn { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; background: #fff; border: 4px solid #000; border-radius: 10px; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 50; display: none; align-items: center; justify-content: center; color: black; }
        .btn { padding: 15px 40px; font-size: 24px; background: #ffcd03; color: black; border: 4px solid #000; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 10px; box-shadow: 0 6px #b59102; transition: 0.1s; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px #b59102; }
        h1 { font-size: 48px; text-shadow: 4px 4px #00a2ff; margin-bottom: 5px; text-align: center; }
        .score-display { font-size: 24px; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        #invincible-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; border: 0px solid rgba(255,255,255,0.5); box-sizing: border-box; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-ui">
        SCORE: <span id="ui-score">00000</span><br>
        COINS: <span id="ui-coins">0</span><br>
        TOTAL COINS: <span id="ui-total-coins">0</span>
        <div id="active-powerup">JETPACK: 10s</div>
    </div>

    <div id="pause-btn" onclick="pauseGame()">||</div>

    <div id="menu-screen" class="screen">
        <h1>jssrf</h1>
        <div class="score-display">HIGH SCORE: <span id="menu-highscore">0</span></div>
        <button class="btn" onclick="startGame()">PLAY</button>
    </div>

    <div id="pause-screen" class="screen" style="display:none;">
        <h1>GAME PAUSED</h1>
        <button class="btn" onclick="resumeGame()">RESUME</button>
        <button class="btn" style="background:#f44336;" onclick="quitGame()">QUIT</button>
    </div>

    <div id="gameover-screen" class="screen" style="display:none;">
        <h1 style="color:#f44336;">CRASHED!</h1>
        <div class="score-display">FINAL SCORE: <span id="go-score">0</span></div>
        <button class="btn" id="respawn-btn" onclick="respawn()">RESPAWN (<span id="respawn-cost">1</span> COINS)</button>
        <button class="btn" style="background:#9e9e9e;" onclick="quitGame()">MAIN MENU</button>
    </div>

    <div id="invincible-flash"></div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'jump') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'duck') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'powerup') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'crash') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        let scene, camera, renderer, player;
        let leftArm, rightArm, leftLeg, rightLeg, torso, head;
        let tracks = [-4, 0, 4]; 
        let currentTrack = 1;    
        let obstacles = [], coins = [], powerups = [], environmentObjects = [];
        
        let score = 0, coinsCollectedThisRun = 0;
        let totalCoins = parseInt(localStorage.getItem("subway_total_coins")) || 0;
        let highscore = parseInt(localStorage.getItem("subway_highscore_points")) || 0;
        
        let gameState = "MENU"; 
        let speed = 0.35, baseSpeed = 0.35, gameTimer = 0;
        
        let isJumping = false, jumpVelocity = 0;
        let isDucking = false, duckTimer = 0;
        const gravity = 0.014; 
        const jumpForce = 0.38;
        let animTime = 0;

        let respawnCost = 1;
        let invincibilityFrames = 0;
        let activePowerup = null, powerupTime = 0; 
        
        let touchStartX = 0, touchStartY = 0;

        document.getElementById("menu-highscore").innerText = highscore;
        document.getElementById("ui-total-coins").innerText = totalCoins;

        init();
        animate();

        function init() {
            if (typeof THREE === 'undefined') return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x3a9ad9); 
            scene.fog = new THREE.FogExp2(0x3a9ad9, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 11); 
            camera.lookAt(0, 2, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(24, 1000), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -450;
            ground.receiveShadow = true;
            scene.add(ground);

            for (let t of tracks) {
                const rail1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 1000), new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.9 }));
                rail1.position.set(t - 0.7, 0.04, -450);
                const rail2 = rail1.clone();
                rail2.position.x = t + 0.7;
                scene.add(rail1, rail2);
            }

            player = new THREE.Group();
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffcd03, roughness: 0.5 }); 
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x00a2ff, roughness: 0.5 });   
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x287f46, roughness: 0.5 });  

            torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.45), blueMat);
            torso.position.y = 1.05;
            torso.castShadow = true;
            player.add(torso);

            head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), yellowMat);
            head.position.set(0, 0.675, 0);
            head.castShadow = true;
            torso.add(head);

            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffcd03'; ctx.fillRect(0,0,64,64);
            ctx.fillStyle = '#000000'; ctx.fillRect(14,20,8,12); ctx.fillRect(42,20,8,12); 

ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(32,32,16,0,Math.PI); ctx.stroke();
const faceTex = new THREE.CanvasTexture(canvas);
head.material = [yellowMat, yellowMat, yellowMat, yellowMat, yellowMat, new THREE.MeshStandardMaterial({map: faceTex})];
const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25); armGeo.translate(0, -0.45, 0);
leftArm = new THREE.Mesh(armGeo, yellowMat); leftArm.position.set(-0.58, 0.45, 0); torso.add(leftArm);
rightArm = new THREE.Mesh(armGeo, yellowMat); rightArm.position.set(0.58, 0.45, 0); torso.add(rightArm);
const legGeo = new THREE.BoxGeometry(0.42, 0.6, 0.42); legGeo.translate(0, -0.3, 0);
leftLeg = new THREE.Mesh(legGeo, greenMat); leftLeg.position.set(-0.22, -0.45, 0); torso.add(leftLeg);
rightLeg = new THREE.Mesh(legGeo, greenMat); rightLeg.position.set(0.22, -0.45, 0); torso.add(rightLeg);
player.position.set(tracks[currentTrack], 0, 0);
scene.add(player);
for (let i = 0; i < 25; i++) spawnEnvironment(-i * 35);
window.addEventListener('keydown', handleKeyDown);
window.addEventListener('touchstart', handleTouchStart, {passive: true});
window.addEventListener('touchmove', handleTouchMove, {passive: false});
window.addEventListener('touchend', handleTouchEnd, {passive: true});
window.addEventListener('resize', onWindowResize);
}
function spawnObstacle(zPos) {
if (activePowerup === "jetpack" || activePowerup === "skyline") {
if (Math.random() < 0.4) spawnCoinRow(tracks[Math.floor(Math.random()*3)], zPos, 7);
return;
}
const trackIndex = Math.floor(Math.random() * 3);
const trackX = tracks[trackIndex];
const rand = Math.random();
if (rand > 0.4) {
const hasRamp = Math.random() > 0.5;
const trainGeo = new THREE.BoxGeometry(2.6, 3.5, 12);
const trainMat = new THREE.MeshStandardMaterial({ color: 0xd93838, roughness: 0.3 });
const train = new THREE.Mesh(trainGeo, trainMat);
train.position.set(trackX, 1.75, zPos);
train.castShadow = true;
train.userData = { type: "train", hasRamp: hasRamp };
scene.add(train);
obstacles.push(train);
if (hasRamp) {
const rampGeo = new THREE.BoxGeometry(2.6, 0.1, 4);
const rampMat = new THREE.MeshStandardMaterial({ color: 0xffcd03 });
const ramp = new THREE.Mesh(rampGeo, rampMat);
ramp.position.set(trackX, 1.75, zPos + 8);
ramp.rotation.x = -0.4;
ramp.userData = { type: "ramp" };
scene.add(ramp);
obstacles.push(ramp);
}
for (let j = -4; j <= 4; j += 2) {
if (Math.random() > 0.2) spawnCoin(trackX, zPos + j, 3.9);
}
} else if (rand > 0.15) {
const barrier = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 0.5), new THREE.MeshStandardMaterial({ color: 0xffcc00 }));
barrier.position.set(trackX, 1.8, zPos);
barrier.userData = { type: "high_barrier" };
scene.add(barrier);
obstacles.push(barrier);
spawnCoin(trackX, zPos - 3, 1.3);
} else {
const hurdle = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 0.5), new THREE.MeshStandardMaterial({ color: 0xef6c00 }));
hurdle.position.set(trackX, 0.6, zPos);
hurdle.userData = { type: "hurdle" };
scene.add(hurdle);
obstacles.push(hurdle);
}
if (Math.random() < 0.12 && !activePowerup) {
spawnPowerUpItem(tracks[Math.floor(Math.random()*3)], zPos - 6);
} else {
if (Math.random() > 0.3) spawnCoin(trackX, zPos - 6, 1.3);
}
}
function spawnCoin(x, z, y = 1.3) {
const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0xffea00, metalness: 0.8 }));
coin.rotation.x = Math.PI / 2;
coin.position.set(x, y, z);
scene.add(coin);
coins.push(coin);
}
function spawnCoinRow(x, z, y) {
for (let i = 0; i < 3; i++) spawnCoin(x, z + (i * 2), y);
}
function spawnPowerUpItem(x, z) {
const pool = ["magnet", "jetpack", "boots", "skyline"];
const type = Math.random() < 0.25 ? "skyline" : pool[Math.floor(Math.random() * 3)];
let color = 0xff00ff;
if (type === "magnet") color = 0xe91e63;
if (type === "jetpack") color = 0x4caf50;
if (type === "boots") color = 0x2196f3;
const geo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
const mat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.5 });
const item = new THREE.Mesh(geo, mat);
item.position.set(x, 1.5, z);
item.userData = { type: type };
scene.add(item);
powerups.push(item);
}
function spawnEnvironment(zPos) {
const poleGeo = new THREE.CylinderGeometry(0.08, 0.08, 9);
const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
const leftPole = new THREE.Mesh(poleGeo, poleMat); leftPole.position.set(-8, 4.5, zPos);
const rightPole = leftPole.clone(); rightPole.position.x = 8;
scene.add(leftPole, rightPole);
environmentObjects.push(leftPole, rightPole);
}
function handleKeyDown(e) {
if (gameState !== "PLAYING") return;
if (e.key === "ArrowLeft") moveLane(-1);
if (e.key === "ArrowRight") moveLane(1);
if (e.key === "ArrowUp") jump();
if (e.key === "ArrowDown") duck();
}
function handleTouchStart(e) {
if (gameState !== "PLAYING") return;
let touch = e.touches[0];
touchStartX = touch.clientX;
touchStartY = touch.clientY;
}
function handleTouchMove(e) {
if (gameState === "PLAYING") e.preventDefault();
}
function handleTouchEnd(e) {
if (gameState !== "PLAYING") return;
let touch = e.changedTouches[0];
let diffX = touch.clientX - touchStartX;
let diffY = touch.clientY - touchStartY;
if (Math.abs(diffX) > Math.abs(diffY)) {
if (Math.abs(diffX) > 30) {
if (diffX > 0) moveLane(1);
else moveLane(-1);
}
} else {
if (Math.abs(diffY) > 30) {
if (diffY < 0) jump();
else duck();
}
}
}
function moveLane(dir) {
let next = currentTrack + dir;
if (next >= 0 && next <= 2) currentTrack = next;
}
function jump() {
if (activePowerup === "jetpack" || activePowerup === "skyline") return;
let currentFloor = getFloorLevel();
if (player.position.y <= currentFloor + 0.05 && !isDucking) {
isJumping = true;
jumpVelocity = activePowerup === "boots" ? jumpForce * 1.4 : jumpForce;
playSound('jump');
}
}
function duck() {
if (activePowerup === "jetpack" || activePowerup === "skyline") return;
if (isJumping) {
player.position.y = getFloorLevel();
isJumping = false;
jumpVelocity = 0;
}
if (!isDucking) {
isDucking = true;
duckTimer = 22;
playSound('duck');
}
}
function getFloorLevel() {
let boxPlayer = new THREE.Box3().setFromObject(torso);
for (let obs of obstacles) {
if (obs.userData.type === "train") {
let boxObs = new THREE.Box3().setFromObject(obs);
if (Math.abs(player.position.x - obs.position.x) < 1.5) {
if (player.position.z > obs.position.z - 6 && player.position.z < obs.position.z + 6) {
return 3.5;
}
}
}
}
return 0;
}
function startGame() {
initAudio();
gameState = "PLAYING";
document.getElementById("menu-screen").style.display = "none";
document.getElementById("pause-btn").style.display = "flex";
resetGameTrack();
}
function pauseGame() {
if (gameState !== "PLAYING") return;
gameState = "PAUSED";
document.getElementById("pause-screen").style.display = "flex";
}
function resumeGame() {
gameState = "PLAYING";
document.getElementById("pause-screen").style.display = "none";
}
function quitGame() {
gameState = "MENU";
document.getElementById("pause-screen").style.display = "none";
document.getElementById("gameover-screen").style.display = "none";
document.getElementById("menu-screen").style.display = "flex";
document.getElementById("pause-btn").style.display = "none";
document.getElementById("menu-highscore").innerText = highscore;
resetGameTrack();
}
function gameOver() {
if (invincibilityFrames > 0) return;
gameState = "GAMEOVER";
playSound('crash');
document.getElementById("pause-btn").style.display = "none";
document.getElementById("go-score").innerText = Math.floor(score);
document.getElementById("respawn-cost").innerText = respawnCost;
document.getElementById("gameover-screen").style.display = "flex";
if (totalCoins < respawnCost) {
document.getElementById("respawn-btn").style.opacity = 0.5;
document.getElementById("respawn-btn").style.pointerEvents = "none";
} else {
document.getElementById("respawn-btn").style.opacity = 1;
document.getElementById("respawn-btn").style.pointerEvents = "auto";
}
}
function respawn() {
if (totalCoins >= respawnCost) {
totalCoins -= respawnCost;
respawnCost *= 2;
localStorage.setItem("subway_total_coins", totalCoins);
document.getElementById("ui-total-coins").innerText = totalCoins;
gameState = "PLAYING";
document.getElementById("gameover-screen").style.display = "none";
document.getElementById("pause-btn").style.display = "flex";
invincibilityFrames = 600;
activePowerup = null;
player.position.y = 0;
isJumping = false;
obstacles.forEach(o => { if (o.position.z > -40) scene.remove(o); });
obstacles = obstacles.filter(o => o.position.z <= -40);
}
}
function resetGameTrack() {
obstacles.forEach(o => scene.remove(o));
coins.forEach(c => scene.remove(c));
powerups.forEach(p => scene.remove(p));
obstacles = []; coins = []; powerups = [];
score = 0; coinsCollectedThisRun = 0; gameTimer = 0;
speed = baseSpeed; currentTrack = 1; respawnCost = 1;
invincibilityFrames = 0; activePowerup = null; powerupTime = 0;
player.position.set(tracks[currentTrack], 0, 0);
document.getElementById("ui-score").innerText = "00000";
document.getElementById("ui-coins").innerText = "0";
}
function animate() {
requestAnimationFrame(animate);
if (gameState === "MENU" && torso) {
animTime += 0.02;
torso.position.y = 1.05 + Math.sin(animTime * 2) * 0.05;
head.rotation.y = Math.sin(animTime) * 0.2;
leftArm.rotation.x = Math.sin(animTime) * 0.3;
rightArm.rotation.x = -Math.sin(animTime) * 0.3;
}
if (gameState === "PLAYING" && typeof THREE !== 'undefined') {
gameTimer += 1/60;
score = gameTimer * 4;
document.getElementById("ui-score").innerText = Math.floor(score).toString().padStart(5, '0');
if (score > highscore) {
highscore = Math.floor(score);
localStorage.setItem("subway_highscore_points", highscore);
}
if (invincibilityFrames > 0) {
invincibilityFrames--;
document.getElementById("invincible-flash").style.border = (invincibilityFrames % 10 < 5) ? "4px solid #fff" : "0px solid #000";
} else {
document.getElementById("invincible-flash").style.border = "0px solid #000";
}
if (activePowerup) {
powerupTime -= 1/60;
document.getElementById("active-powerup").style.display = "block";
document.getElementById("active-powerup").innerText = activePowerup.toUpperCase() + ": " + Math.ceil(powerupTime) + "s";
if (powerupTime <= 0) {
activePowerup = null;
document.getElementById("active-powerup").style.display = "none";
}
}
targetTrackX = tracks[currentTrack];
player.position.x = THREE.MathUtils.lerp(player.position.x, targetTrackX, 0.28);
let floorLevel = getFloorLevel();
if (activePowerup === "jetpack" || activePowerup === "skyline") {
player.position.y = THREE.MathUtils.lerp(player.position.y, 6.5, 0.1);
isJumping = false;
} else {
if (isJumping) {
player.position.y += jumpVelocity;
jumpVelocity -= gravity;
if (player.position.y <= floorLevel) {
player.position.y = floorLevel;
isJumping = false;
}
} else {
if (player.position.y > floorLevel) {
player.position.y -= 0.2;
if (player.position.y < floorLevel) player.position.y = floorLevel;
} else if (player.position.y < floorLevel) {
player.position.y = THREE.MathUtils.lerp(player.position.y, floorLevel, 0.2);
}
}
}
if (isDucking) {
torso.scale.y = THREE.MathUtils.lerp(torso.scale.y, 0.4, 0.3);
duckTimer--;
if (duckTimer <= 0) isDucking = false;
} else {
torso.scale.y = THREE.MathUtils.lerp(torso.scale.y, 1.0, 0.2);
}
if (activePowerup === "jetpack" || activePowerup === "skyline") {
leftLeg.rotation.x = 0.2; rightLeg.rotation.x = -0.2;
leftArm.rotation.x = Math.PI; rightArm.rotation.x = Math.PI;
} else if (isJumping) {
leftLeg.rotation.x = -0.4; rightLeg.rotation.x = -0.4;
leftArm.rotation.x = 0.5; rightArm.rotation.x = 0.5;
} else {
animTime += speed * 0.6;
leftLeg.rotation.x = Math.sin(animTime) * 0.7;
rightLeg.rotation.x = -Math.sin(animTime) * 0.7;
leftArm.rotation.x = -Math.sin(animTime) * 0.7;
rightArm.rotation.x = Math.sin(animTime) * 0.7;
}
speed += 0.00002;
let playerBox = new THREE.Box3().setFromObject(torso);
for (let i = obstacles.length - 1; i >= 0; i--) {
let obs = obstacles[i];
obs.position.z += speed;
let obsBox = new THREE.Box3().setFromObject(obs);
if (playerBox.intersectsBox(obsBox)) {
if (obs.userData.type === "ramp") {
player.position.y = floorLevel = 3.5;
} else if (obs.userData.type === "train") {
if (player.position.y < 3.0) gameOver();
} else if (obs.userData.type === "high_barrier") {
if (!isDucking) gameOver();
} else {
gameOver();
}
}
if (obs.position.z > 15) { scene.remove(obs); obstacles.splice(i, 1); }
}
for (let i = coins.length - 1; i >= 0; i--) {
let coin = coins[i];
coin.position.z += speed;
coin.rotation.z += 0.05;
if (activePowerup === "magnet" && coin.position.z > -30) {
coin.position.x = THREE.MathUtils.lerp(coin.position.x, player.position.x, 0.15);
coin.position.y = THREE.MathUtils.lerp(coin.position.y, player.position.y + 0.5, 0.15);
}
let coinBox = new THREE.Box3().setFromObject(coin);
if (playerBox.intersectsBox(coinBox)) {
coinsCollectedThisRun++;
totalCoins++;
localStorage.setItem("subway_total_coins", totalCoins);
document.getElementById("ui-coins").innerText = coinsCollectedThisRun;
document.getElementById("ui-total-coins").innerText = totalCoins;
playSound('coin');
scene.remove(coin); coins.splice(i, 1);
continue;
}
if (coin.position.z > 15) { scene.remove(coin); coins.splice(i, 1); }
}
for (let i = powerups.length - 1; i >= 0; i--) {
let pu = powerups[i];
pu.position.z += speed;
pu.rotation.y += 0.04;
let puBox = new THREE.Box3().setFromObject(pu);
if (playerBox.intersectsBox(puBox)) {
activePowerup = pu.userData.type;
powerupTime = 10;
playSound('powerup');
scene.remove(pu); powerups.splice(i, 1);
continue;
}
if (pu.position.z > 15) { scene.remove(pu); powerups.splice(i, 1); }
}
for (let obj of environmentObjects) {
obj.position.z += speed;
if (obj.position.z > 20) obj.position.z = -650;
}
if (obstacles.length < 15) {
let maxZ = obstacles.length > 0 ? Math.min(...obstacles.map(o => o.position.z)) : -50;
spawnObstacle(maxZ - (Math.random() * 20 + 30));
}
}
if (typeof THREE !== 'undefined' && renderer && (gameState === "PLAYING" || gameState === "MENU")) {
renderer.render(scene, camera);
}
}
function onWindowResize() {
if (typeof THREE === 'undefined' || !camera) return;
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
